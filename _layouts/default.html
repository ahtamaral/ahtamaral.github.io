<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}Artur Amaral</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,700;1,8..60,400&display=swap">
  <link rel="stylesheet" href="/style.css">
  <script src="/theme.js"></script>
</head>
<body>
  <header>
    <h1>Artur Amaral</h1>
    <nav><a href="/"{% if page.url == "/" %} aria-current="page"{% endif %}>Home</a><a href="/blog/"{% if page.url contains "/blog/" %} aria-current="page"{% endif %}>Blog</a><button onclick="toggleTheme()" aria-label="Toggle theme"></button></nav>
  </header>
  <main>
    {% if page.collection == "posts" %}
    <h2>{{ page.title }}</h2>
    <p class="date">{{ page.date | date: "%Y-%m-%d" }}</p>
    {% endif %}
    {{ content }}
  </main>
</body>
</html>
